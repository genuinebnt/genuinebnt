.pillstrong { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #1a1e25; }
</style>
<text class="seclabel" x="0" y="44">CURRENT WORK</text><line class="rule" x1="0" y1="49" x2="880" y2="49"/>
<g transform="translate(0,65)">
<clipPath id="cdb-labs"><rect x="0" y="0" width="880" height="104" rx="6"/></clipPath>
<rect class="card" x="0.5" y="0.5" width="879" height="103" rx="6"/>
<g clip-path="url(#cdb-labs)"><rect x="0" y="0" width="3" height="104" fill="#f0703c"/></g>
<text class="name" x="18" y="24">db-labs</text>
<text class="chiptext" x="88" y="24">Rust · storage &amp; recovery</text>
<text class="desc" x="18" y="46">A database, written from the disk up. An LSM-tree storage engine — write-ahead log, SSTables, bloom filters, leveled compaction —</text>
<text class="desc" x="18" y="65">plus a Raft-backed key-value store exercised under chaos testing.</text>
<rect class="chip" x="18" y="73" width="34" height="17" rx="8.5"/><text class="chiptext" x="26" y="85">WAL</text><rect class="chip" x="57" y="73" width="40" height="17" rx="8.5"/><text class="chiptext" x="65" y="85">MVCC</text><rect class="chip" x="102" y="73" width="58" height="17" rx="8.5"/><text class="chiptext" x="110" y="85">B+ tree</text><rect class="chip" x="165" y="73" width="76" height="17" rx="8.5"/><text class="chiptext" x="173" y="85">compaction</text><rect class="chip" x="246" y="73" width="64" height="17" rx="8.5"/><text class="chiptext" x="254" y="85">recovery</text>
</g>
<g transform="translate(0,179)">
<clipPath id="cgossip-glomers"><rect x="0" y="0" width="880" height="104" rx="6"/></clipPath>
<rect class="card" x="0.5" y="0.5" width="879" height="103" rx="6"/>
<g clip-path="url(#cgossip-glomers)"><rect x="0" y="0" width="3" height="104" fill="#4a90e8"/></g>
<text class="name" x="18" y="24">gossip-glomers</text>
<text class="chiptext" x="144" y="24">Rust · consensus &amp; fault tolerance</text>
<text class="desc" x="18" y="46">Distributed systems that survive the network. Fly.io&#x27;s challenge set, solved and written up one at a time — efficient broadcast</text>
<text class="desc" x="18" y="65">under partition, a grow-only counter, a replicated log.</text>
<rect class="chip" x="18" y="73" width="40" height="17" rx="8.5"/><text class="chiptext" x="26" y="85">Raft</text><rect class="chip" x="63" y="73" width="82" height="17" rx="8.5"/><text class="chiptext" x="71" y="85">replication</text><rect class="chip" x="150" y="73" width="76" height="17" rx="8.5"/><text class="chiptext" x="158" y="85">partitions</text><rect class="chip" x="231" y="73" width="106" height="17" rx="8.5"/><text class="chiptext" x="239" y="85">linearizability</text>
</g>
</svg>