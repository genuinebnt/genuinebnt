<text class="eyebrow" x="0" y="26">GENUINE BASIL · SYSTEMS ENGINEER</text>
<text class="h1" x="0" y="66">I build the layer <tspan class="h1acc">underneath</tspan> the application.</text>
<text class="lead" x="0" y="96">Storage engines, consensus protocols, job queues, request tracing. Deliberately</text>
<text class="lead" x="0" y="122">close to database and distributed infrastructure: the way I understand how</text>
<text class="lead" x="0" y="148">systems like Postgres, CockroachDB and Snowflake work is by building smaller</text>
<text class="lead" x="0" y="174">versions of the same problems myself.</text>
<rect class="pill" x="0" y="206" width="50" height="24" rx="12"/>
<text class="pilltext" x="12" y="222">Rust</text>
<rect class="pill" x="58.4" y="206" width="149" height="24" rx="12"/>
<text class="pilltext" x="70.4" y="222">distributed systems</text>
<rect class="pill" x="215.79999999999998" y="206" width="143" height="24" rx="12"/>
<text class="pilltext" x="227.79999999999998" y="222">database internals</text>
<rect class="pill" x="366.6" y="206" width="130" height="24" rx="12"/>
<text class="pilltext" x="378.6" y="222">genuinebasil.dev</text>
