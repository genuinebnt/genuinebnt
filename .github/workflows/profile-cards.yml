name: profile cards

# Generates the activity graph, contribution calendar and coding-time card and
# commits them to assets/, so the README renders from files we own. The upstream
# activity-graph instance shares its GitHub API token across every user embedding
# it, and when that pool is exhausted it answers 200 with the error text drawn
# *inside* the SVG, which camo then caches for hours. Fetching it here instead
# means a bad response is caught and discarded once a day rather than pinned to
# the profile.
#
# The contribution snake is not here — animation.yml already generates it and
# pushes it to the output branch.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/profile-cards.yml]

permissions:
  contents: write

# Two runs must never overlap: the metrics steps commit through the GitHub API,
# so a run that starts before an earlier one finishes checks out a SHA that is
# already stale by the time it tries to push.
concurrency:
  group: profile-cards
  cancel-in-progress: false

env:
  # metrics renders light-themed by default: near-black text on an implicit white
  # page, and a GitHub-green calendar. Both read as a bright rectangle dropped
  # into a dark README. These override the palette to the README's own accent.
  # The calendar squares are plain fill attributes with no class to hook, so they
  # are matched on their literal colour — attribute selectors beat presentation
  # attributes, which is what makes this work at all. Values come from the site's
  # own theme tokens (frontend/styles/_tokens.scss, $themes.dark).
  CARD_CSS: |
    svg { color: #6b7280 !important; }
    h2, h3 { color: #00d4a4 !important; }
    .field svg { fill: #6b7280 !important; }

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: activity graph
        run: |
          set -euo pipefail
          mkdir -p assets
          url="https://github-readme-activity-graph.vercel.app/graph?username=genuinebnt&bg_color=0d0f12&color=e2e6ee&line=00d4a4&point=e2e6ee&area=true&area_color=103a34&hide_border=true&custom_title=contribution%20activity&radius=10"

          for attempt in 1 2 3 4 5; do
            curl -sSfL "$url" -o graph.tmp || true

            # The service reports failure inside a 200 response, so the status
            # code proves nothing — the body has to be inspected.
            if [ -s graph.tmp ] && ! grep -qiE 'failed|error' graph.tmp; then
              mv graph.tmp assets/activity.svg
              echo "activity graph updated on attempt $attempt"
              exit 0
            fi

            echo "attempt $attempt returned an error render, retrying"
            sleep $((attempt * 20))
          done

          # Keeping yesterday's committed graph beats replacing it with an error.
          echo "::warning::activity graph unavailable, keeping the existing copy"

      # The previous run's metrics steps commit through the API, so master can
      # already be ahead of this checkout. Rebasing onto it first is what keeps
      # the push below from being rejected as non-fast-forward.
      - name: sync with commits made outside this checkout
        run: git pull --rebase --autostash origin master

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate activity graph"
          file_pattern: assets/activity.svg

      # The metrics steps run after the commit above because they commit through
      # the GitHub API, moving the remote head and leaving this checkout behind.
      - name: contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: genuinebnt
          filename: assets/calendar.svg
          base: ""
          config_output: svg
          config_timezone: UTC
          committer_branch: master
          committer_message: "chore: regenerate contribution calendar"
          output_condition: data-changed
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            ${{ env.CARD_CSS }}
            [fill="#ebedf0"] { fill: #13161b !important; }
            [fill="#9be9a8"] { fill: #0d3b33 !important; }
            [fill="#40c463"] { fill: #0e6b5b !important; }
            [fill="#30a14e"] { fill: #00a582 !important; }
            [fill="#216e39"] { fill: #00d4a4 !important; }

      - name: coding time
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: genuinebnt
          filename: assets/wakatime.svg
          base: ""
          config_output: svg
          committer_branch: master
          committer_message: "chore: regenerate coding time"
          output_condition: data-changed
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 365
          # The -graphs variants are what draw the bars; without them the card is
          # a flat list of sentences. projects is omitted deliberately.
          plugin_wakatime_sections: time, languages, languages-graphs, editors, editors-graphs
          extras_css: ${{ env.CARD_CSS }}
